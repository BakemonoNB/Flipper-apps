<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Flipper Pont</title>
<style>
  :root {
    --bg: #f5f5f3; --fg: #17171a; --muted: #6a6a72; --card: #ffffff; --border: #d8d8dd;
    --accent: #ff8200; --bezel: #2b2b30; --ok: #1d8a3a; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --fg: #ececf0; --muted: #9a9aa3; --card: #1c1c21; --border: #2f2f36; --bezel: #000; --ok: #4cc36a; --err: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 520px; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, system-ui, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .statuses { flex: 1; min-width: 0; }
  .status { color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.small { font-size: 13px; font-weight: 500; }
  .status.on { color: var(--ok); }
  .status.bad { color: var(--err); }
  details + details { margin-top: 10px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; font: 16px/1.3 ui-monospace, Menlo, monospace; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  #vpsSave { margin-top: 12px; width: 100%; }
  .chat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  .chat-head { display: flex; gap: 8px; align-items: center; }
  .chat-head select { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  .chat-head button { padding: 8px 10px; font-size: 14px; }
  .chat-log { max-height: 50vh; min-height: 80px; overflow-y: auto; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 8px 10px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; max-width: 88%; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #111; }
  .msg.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg.tool { align-self: flex-start; color: var(--muted); font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 2px 4px; }
  .msg.error { align-self: flex-start; color: var(--err); font-size: 14px; }
  .msg.wait { align-self: flex-start; color: var(--muted); font-style: italic; }
  .chat-empty { color: var(--muted); font-size: 14px; text-align: center; margin: 16px 0; }
  .chat-input { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input textarea { flex: 1; min-width: 0; font: 16px/1.4 -apple-system, system-ui, sans-serif; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; resize: none; }
  button { font: inherit; color: inherit; border-radius: 12px; border: 1px solid var(--border); background: var(--card); padding: 10px 16px; }
  button:disabled { opacity: .4; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  button.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 8px 0; }
  .screen-wrap { background: var(--bezel); border-radius: 14px; padding: 10px; }
  canvas { display: block; width: 100%; aspect-ratio: 2 / 1; image-rendering: pixelated; border-radius: 6px; background: var(--accent); }
  body:not(.connected) canvas { opacity: .45; }
  .meta { color: #8a8a92; font-size: 12px; text-align: right; min-height: 16px; margin-top: 4px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 20px auto 8px; }
  .pad button {
    height: 64px; display: grid; place-items: center; padding: 0; font-weight: 700;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .pad button svg { width: 22px; height: 22px; fill: currentColor; }
  .pad button.center { border-radius: 50%; width: 64px; justify-self: center; }
  .pad button.active { background: var(--accent); border-color: var(--accent); color: #111; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 16px; }
  details { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  summary { cursor: pointer; font-weight: 600; }
  #log { max-height: 240px; overflow: auto; margin: 8px 0; white-space: pre-wrap; word-break: break-all; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<header>
  <div class="statuses">
    <div id="status" class="status">Flipper déconnecté</div>
    <div id="vpsStatus" class="status small">VPS : non configuré</div>
  </div>
  <button id="main" class="primary">Connecter</button>
</header>

<section class="screen-wrap">
  <canvas id="screen" width="128" height="64" aria-label="Écran du Flipper"></canvas>
  <div id="fps" class="meta"></div>
</section>

<section class="pad" aria-label="Boutons du Flipper">
  <span></span>
  <button data-key="UP" aria-label="Haut"><svg viewBox="0 0 24 24"><path d="M12 6l8 10H4z"/></svg></button>
  <span></span>
  <button data-key="LEFT" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M6 12l10-8v16z"/></svg></button>
  <button data-key="OK" class="center" aria-label="OK">OK</button>
  <button data-key="RIGHT" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M18 12L8 20V4z"/></svg></button>
  <span></span>
  <button data-key="DOWN" aria-label="Bas"><svg viewBox="0 0 24 24"><path d="M12 18L4 8h16z"/></svg></button>
  <button data-key="BACK" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M10 5L3 11l7 6v-4h5a4 4 0 010 8h-3v2h3a6 6 0 000-12h-5z"/></svg></button>
</section>
<p class="hint">Tap = appui court · garder 0,5 s = appui long</p>

<section class="chat" aria-label="Chat avec les modèles du VPS">
  <div class="chat-head">
    <select id="chatModel" aria-label="Modèle"></select>
    <button id="chatReset">Nouvelle conv.</button>
  </div>
  <div id="chatLog" class="chat-log" aria-live="polite"></div>
  <div class="chat-input">
    <textarea id="chatText" rows="2" placeholder="Demande au modèle…" autocapitalize="sentences"></textarea>
    <button id="chatSend" class="primary">Envoyer</button>
  </div>
</section>

<details>
  <summary>Journal</summary>
  <div id="log"></div>
  <button id="copy">Copier le journal</button>
</details>
<details>
  <summary>Serveur VPS</summary>
  <label for="vpsUrl">Adresse</label>
  <input id="vpsUrl" type="url" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="vpsToken">Jeton du téléphone</label>
  <input id="vpsToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="vpsSave">Enregistrer et connecter</button>
</details>
<button id="other" class="link">Choisir dans la liste complète des appareils</button>

<script type="module" src="app.js"></script>
</body>
</html>
